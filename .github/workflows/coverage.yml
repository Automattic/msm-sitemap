name: Code Coverage

on:
  push:
    paths:
      - '**.php'
      - 'composer.json'
      - 'phpunit.xml.dist'
      - '.wp-env.json'
      - '.github/workflows/coverage.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - '**.php'
      - 'composer.json'
      - 'phpunit.xml.dist'
      - '.wp-env.json'
      - '.github/workflows/coverage.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      # Composer only installs dependencies here. The tests and the merge run
      # inside the wp-env tests container, so this matches its PHP version.
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0

      - name: Start wp-env with Xdebug coverage
        run: npm run wp-env start -- --xdebug=coverage

      - name: Run tests with coverage and merge the results
        run: composer coverage

      - name: Add coverage summary to the job summary
        run: |
          {
            echo '## Code coverage'
            echo
            echo '```'
            cat coverage/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            coverage/clover.xml
            coverage/coverage.txt
            coverage/html/
          if-no-files-found: error
