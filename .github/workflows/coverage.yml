name: Code Coverage

on:
  push:
    paths:
      - '**.php'
      - 'composer.json'
      - 'phpunit.xml.dist'
      - '.wp-env.json'
      - '.github/workflows/coverage.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - '**.php'
      - 'composer.json'
      - 'phpunit.xml.dist'
      - '.wp-env.json'
      - '.github/workflows/coverage.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      # Composer only installs dependencies here. The tests and the merge run
      # inside the wp-env tests container, so this matches its PHP version.
      - name: Setup PHP
        uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # 2.36.0
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@3cf229dc2919194e9e36783941438d17239e8520 # v3.1.1

      - name: Start wp-env with Xdebug coverage
        run: npm run wp-env start -- --xdebug=coverage

      - name: Run tests with coverage and merge the results
        run: composer coverage

      - name: Add coverage summary to the job summary
        run: |
          {
            echo '## Code coverage'
            echo
            echo '```'
            cat coverage/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            coverage/clover.xml
            coverage/coverage.txt
            coverage/html/
          if-no-files-found: error
