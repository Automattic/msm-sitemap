name: Create GitHub Release

on:
  push:
    tags:
      - '*'

permissions: {}

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    # Publishing the release needs write access to the repository contents.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The admin chart loads Flot from the js/flot submodule.
          submodules: true

      # No build step: the plugin ships its CSS and JavaScript as committed,
      # and package.json only holds wp-env for local development.

      - name: Create distribution ZIP
        run: |
          # The folder name sites install the plugin under. The plugin isn't on
          # WordPress.org, so this is the repository's established folder name.
          PLUGIN_SLUG="msm-sitemap"

          # Stage outside the checkout. A destination inside the source has
          # rsync copy the staging directory into itself, and $RUNNER_TEMP
          # removes the need for .distignore to list it.
          mkdir -p "$RUNNER_TEMP/dist/$PLUGIN_SLUG"

          # Copy files, respecting .distignore. The ZIP must contain a single
          # top-level directory named after the plugin folder, or WordPress
          # unpacks the files loose into wp-content/plugins/.
          rsync -rc --exclude-from=".distignore" ./ "$RUNNER_TEMP/dist/$PLUGIN_SLUG/"

          # Fail rather than ship an admin screen without its chart library.
          test -f "$RUNNER_TEMP/dist/$PLUGIN_SLUG/js/flot/jquery.flot.js"

          # Create ZIP
          cd "$RUNNER_TEMP/dist"
          zip -r "$RUNNER_TEMP/${PLUGIN_SLUG}.zip" "$PLUGIN_SLUG"

      - name: Prepare release title and notes
        id: prep
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -u

          # Strip an optional leading "v" from the tag (v1.2.3 -> 1.2.3).
          VERSION="${VERSION#v}"

          # Title: "<Plugin Name> <version>", read from the "Plugin Name:" header
          # of the main plugin file, so the title carries context wherever the
          # release is surfaced (Slack, email notifications, and so on).
          PLUGIN_NAME="$(grep -h 'Plugin Name:' -- *.php | head -n1 | sed -E 's/.*Plugin Name:[[:space:]]*//; s/[[:space:]]*$//')"
          echo "title=${PLUGIN_NAME} ${VERSION}" >> "$GITHUB_OUTPUT"

          # Notes: the CHANGELOG entry for this version, with the top
          # "## [x.y.z] - date" heading dropped (the title already conveys it) and the
          # "###" subsections promoted to "##" so they render as top-level sections.
          awk -v ver="$VERSION" '
            $0 ~ ("^## \\[?" ver "(\\]| |$)") { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | sed -E 's/^### /## /' > notes.raw

          # Trim leading and trailing blank lines.
          awk 'NF { seen = 1 } seen' notes.raw | tac | awk 'NF { seen = 1 } seen' | tac > notes.md

          if [ -s notes.md ]; then
            echo "have_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_notes=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No CHANGELOG entry found for ${VERSION}; falling back to auto-generated notes."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          # Title with the plugin name, and body from the CHANGELOG when available;
          # otherwise fall back to GitHub's auto-generated notes.
          name: ${{ steps.prep.outputs.title }}
          body_path: ${{ steps.prep.outputs.have_notes == 'true' && 'notes.md' || '' }}
          generate_release_notes: ${{ steps.prep.outputs.have_notes != 'true' }}
          files: ${{ runner.temp }}/*.zip
          draft: false
          # A hyphenated tag (1.2.3-beta1) is a pre-release, so GitHub should not
          # badge it "Latest" and point every download at a beta.
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
